{% extends "dashboard.html" %}
{% block title %}Record Customer Payment — Arshaf Sanitary Store{% endblock %}
{% block page_title %}Record Customer Payment & Receipt{% endblock %}

{% block content %}
<div style="max-width: 540px; margin: 0 auto;">
    <div class="card" style="padding: 28px;">
        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border-subtle);">
            <div style="width: 42px; height: 42px; border-radius: var(--radius-md); background: var(--success-bg); color: var(--success); display: flex; align-items: center; justify-content: center;">
                <i data-lucide="arrow-down-left" style="width: 22px; height: 22px;"></i>
            </div>
            <div>
                <h3 style="font-size: 1.15rem; color: var(--primary); margin: 0; font-weight: 700;">Customer Payment Entry</h3>
                <p style="font-size: 0.8rem; color: var(--text-secondary); margin: 0;">Credits customer ledger and updates outstanding due</p>
            </div>
        </div>

        <form method="POST" action="/customers/payments/new">
            <div class="form-group">
                <label>Select Customer *</label>
                <select name="customer_id" class="form-control" required style="font-size: 0.92rem;">
                    <option value="">Select customer account...</option>
                    {% for c in customers %}
                    <option value="{{ c.id }}" {% if selected_customer_id and selected_customer_id|string == c.id|string %}selected{% endif %}>
                        {{ c.name }} ({{ c.customer_code }}) — Outstanding: Rs. {{ '%.2f'|format(c.current_balance|float) }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label>Receipt Date *</label>
                    <input type="date" name="date" class="form-control" value="{{ today }}" required>
                </div>

                <div class="form-group">
                    <label>Payment Method *</label>
                    <select name="payment_method" class="form-control">
                        {% for m in payment_methods %}
                        <option value="{{ m }}">{{ m }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Amount Received (Rs.) *</label>
                <input type="number" step="0.01" name="amount" class="form-control" required placeholder="0.00" style="font-size: 1.15rem; font-weight: 700; color: var(--secondary);">
            </div>

            <div class="form-group" style="margin-bottom: 24px;">
                <label>Reference Note / Cheque No / Bank Trans ID</label>
                <input name="note" class="form-control" placeholder="e.g. Online transfer ref #89281, Cheque #01928...">
            </div>

            <div class="form-actions" style="padding-top: 16px; border-top: 1px solid var(--border-subtle);">
                <a href="/customers" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-teal btn-lg">
                    <i data-lucide="check" style="width: 18px; height: 18px;"></i>
                    Post Payment Receipt
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
