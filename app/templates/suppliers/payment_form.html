{% extends "dashboard.html" %}
{% block title %}Record Supplier Payment — Arshaf Sanitary Store{% endblock %}
{% block page_title %}Disburse Supplier Payment{% endblock %}

{% block content %}
<div style="max-width: 540px; margin: 0 auto;">
    <div class="card" style="padding: 28px;">
        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border-subtle);">
            <div style="width: 42px; height: 42px; border-radius: var(--radius-md); background: #E0E7FF; color: #4338CA; display: flex; align-items: center; justify-content: center;">
                <i data-lucide="arrow-up-right" style="width: 22px; height: 22px;"></i>
            </div>
            <div>
                <h3 style="font-size: 1.15rem; color: var(--primary); margin: 0; font-weight: 700;">Supplier Payment Disbursal</h3>
                <p style="font-size: 0.8rem; color: var(--text-secondary); margin: 0;">Reduces account payable balance in supplier ledger</p>
            </div>
        </div>

        <form method="POST" action="/suppliers/payments/new">
            <div class="form-group">
                <label>Select Supplier *</label>
                <select name="supplier_id" class="form-control" required style="font-size: 0.92rem;">
                    <option value="">Select supplier account...</option>
                    {% for s in suppliers %}
                    <option value="{{ s.id }}">
                        {{ s.name }} ({{ s.supplier_code }}) — Payable: Rs. {{ '%.2f'|format(s.current_balance|float) }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label>Disbursal Date *</label>
                    <input type="date" name="date" class="form-control" value="{{ today }}" required>
                </div>

                <div class="form-group">
                    <label>Payment Method *</label>
                    <select name="payment_method" class="form-control">
                        {% for m in payment_methods %}
                        <option value="{{ m }}">{{ m }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Amount Paid to Supplier (Rs.) *</label>
                <input type="number" step="0.01" name="amount" class="form-control" required placeholder="0.00" style="font-size: 1.15rem; font-weight: 700; color: var(--secondary);">
            </div>

            <div class="form-group" style="margin-bottom: 24px;">
                <label>Transaction Reference / Cheque #</label>
                <input name="note" class="form-control" placeholder="e.g. Bank online transfer, Cheque #89102...">
            </div>

            <div style="display: flex; gap: 12px; justify-content: flex-end; padding-top: 16px; border-top: 1px solid var(--border-subtle);">
                <a href="/suppliers" class="btn btn-secondary" style="width: auto;">Cancel</a>
                <button type="submit" class="btn btn-teal btn-lg" style="width: auto;">
                    <i data-lucide="check" style="width: 18px; height: 18px;"></i>
                    Record Payment
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
